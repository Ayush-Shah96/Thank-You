<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Always there for you, brother</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #1e293b 0%, #0b1120 70%);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #f8fafc; overflow: hidden;
  }
  .stage { text-align: center; padding: 24px; }
  .heart {
    font-size: 64px; display: inline-block;
    animation: pulse 1.6s ease-in-out infinite;
    filter: drop-shadow(0 0 18px rgba(248,113,113,.6));
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }
  h1 {
    font-size: clamp(1.6rem, 6vw, 2.6rem); margin: 18px 0 8px; font-weight: 700;
    opacity: 0; animation: fadeUp 1.2s ease-out .4s forwards;
  }
  .sub {
    font-size: clamp(1rem, 4vw, 1.25rem); color: #94a3b8; margin: 0;
    opacity: 0; animation: fadeUp 1.2s ease-out 1.4s forwards;
  }
  .stars { position: fixed; inset: 0; pointer-events: none; }
  .star {
    position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: #fde68a; opacity: 0;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: translateY(0); }
    50% { opacity: .9; transform: translateY(-12px); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    h1, .sub { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="stage">
    <div class="heart">&#10084;&#65039;</div>
    <h1>Always there for you, brother</h1>
    <p class="sub">Whenever you need me, I'm here.</p>
  </div>
  <script>
    const field = document.getElementById('stars');
    for (let i = 0; i < 40; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = (Math.random() * 3) + 's';
      field.appendChild(s);
    }
  </script>
</body>
</html>
